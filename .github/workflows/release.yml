name: Release Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential rpm

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          cmake --build .

      - name: Package (CPack)
        run: |
          cd build
          cpack -G "DEB;RPM;TGZ;ZIP"
          echo "=== Created packages ==="
          ls -lh *.deb *.rpm *.tar.gz *.zip 2>/dev/null || echo "No packages found"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            build/*.deb
            build/*.rpm
            build/*.tar.gz
            build/*.zip
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          cmake --build .

      - name: Package (CPack)
        run: |
          cd build
          cpack -G DragNDrop
          echo "=== Created DMG ==="
          ls -lh *.dmg 2>/dev/null || echo "No DMG found"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: build/*.dmg
          if-no-files-found: error

  create-release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show downloaded files
        run: |
          echo "=== Artifacts structure ==="
          find artifacts -type f
          echo "=== Linux packages ==="
          ls -lh artifacts/linux-packages/ 2>/dev/null || echo "No linux packages"
          echo "=== macOS packages ==="
          ls -lh artifacts/macos-packages/ 2>/dev/null || echo "No macOS packages"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/linux-packages/*
            artifacts/macos-packages/*
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
